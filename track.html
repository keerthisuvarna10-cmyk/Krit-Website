<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Track Your Order | KRIT</title>
<link rel="icon" type="image/png" href="https://res.cloudinary.com/djicyjlid/image/upload/e_trim/c_crop,w_0.44,h_1.0,g_west/e_trim/c_pad,w_512,h_512,b_transparent/f_png/v1776879169/ChatGPT_Image_Apr_22_2026_11_02_34_PM_bossql.png">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-HH8J1E6G44"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-HH8J1E6G44', { page_title: document.title, page_location: window.location.href });
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2340;--muted:#6b7a99;--soft:#3a4466;
    --gold:#C9A84C;--gold-deep:#b68f31;--gold-light:#E8C96E;
    --blue:#2F5DA8;
    --ok:#1a7f4f;--ok-bg:rgba(26,127,79,.09);
    --danger:#c83838;
    --card:#F6F7FA;--card-line:#D8DCE6;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;color:var(--ink);font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased;
    background:linear-gradient(135deg,#0d1528 0%,#1B2340 50%,#0a1020 100%);
  }
  a{color:inherit}
  button{font:inherit;cursor:pointer}
  .hide{display:none !important}

  .top{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:rgba(13,21,40,.97);position:sticky;top:0;z-index:5;box-shadow:0 2px 12px rgba(10,16,32,.18)}
  .top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,var(--gold),var(--gold-light),var(--blue))}
  .top img{height:32px;width:auto;display:block}
  @media(max-width:520px){.top img{height:26px}}
  .back{padding:9px 16px;border-radius:999px;border:1.5px solid rgba(27,35,64,.15);background:#fff;color:var(--soft);font-size:.74rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;text-decoration:none}

  .shell{max-width:640px;margin:0 auto;padding:28px 16px 64px;display:flex;flex-direction:column;gap:16px}
  .card{background:var(--card);border:1px solid var(--card-line);border-radius:18px;padding:24px;box-shadow:0 2px 10px rgba(27,35,64,.06)}
  h1{font-family:'Playfair Display',serif;font-size:1.6rem;margin:0 0 6px;color:#fff}
  .lead{color:#c6d2ea;font-size:.92rem;line-height:1.6;margin:0}
  h2{font-family:'Playfair Display',serif;font-size:1.2rem;margin:0}

  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:520px){.row{grid-template-columns:1fr}}
  .field{display:flex;flex-direction:column;gap:6px;min-width:0}
  label{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-deep);font-weight:700}
  input{width:100%;border:1.5px solid #CDD1DD;background:#fff;color:var(--ink);border-radius:12px;padding:13px 15px;font:inherit;font-weight:500;outline:none}
  input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(201,168,76,.12)}
  .btn{margin-top:16px;width:100%;border:none;border-radius:12px;padding:15px;background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:var(--ink);font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:.8rem;box-shadow:0 6px 16px rgba(201,168,76,.28)}
  .btn:disabled{opacity:.6;cursor:wait}
  .msg{margin-top:12px;font-size:.86rem;line-height:1.5}
  .msg.err{color:var(--danger)}
  .help{font-size:.78rem;color:var(--muted);margin-top:10px;line-height:1.5}

  .head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
  .oid{font-size:.78rem;color:var(--muted);letter-spacing:.06em}
  .badge{display:inline-block;padding:6px 12px;border-radius:999px;font-size:.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;background:rgba(47,93,168,.1);color:var(--blue)}
  .badge.done{background:var(--ok-bg);color:var(--ok)}
  .badge.bad{background:rgba(200,56,56,.1);color:var(--danger)}
  .eta{margin-top:10px;font-size:.92rem;color:var(--soft);line-height:1.5}

  .timeline{list-style:none;margin:22px 0 0;padding:0}
  .step{position:relative;display:flex;gap:14px;padding-bottom:22px}
  .step:last-child{padding-bottom:0}
  .step::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:#D0D4E0}
  .step:last-child::before{display:none}
  .step.done::before{background:var(--gold)}
  .dot{flex:0 0 28px;width:28px;height:28px;border-radius:50%;border:2px solid #C4C9D6;background:#fff;display:flex;align-items:center;justify-content:center;z-index:1}
  .step.done .dot{border-color:var(--gold);background:var(--gold)}
  .step.done .dot svg{display:block}
  .dot svg{display:none;width:14px;height:14px;stroke:var(--ink);stroke-width:3;fill:none}
  .step.current .dot{box-shadow:0 0 0 6px rgba(201,168,76,.22)}
  .s-label{font-weight:700;font-size:.96rem;color:#9aa4bd;padding-top:3px}
  .step.done .s-label{color:var(--ink)}
  .s-at{font-size:.8rem;color:var(--muted);margin-top:2px}
  .s-extra{margin-top:8px;font-size:.85rem;color:var(--soft);background:#fff;border:1px solid var(--card-line);border-radius:10px;padding:10px 12px;line-height:1.6}
  .s-extra a{color:var(--blue);font-weight:700}

  .items{margin:0;padding:0;list-style:none}
  .items li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--card-line);font-size:.92rem}
  .items li:last-child{border-bottom:none}
  .sum{display:flex;justify-content:space-between;padding-top:12px;font-weight:800}
  .pay{font-size:.82rem;color:var(--muted);margin-top:6px}
  .wa{display:block;text-align:center;margin-top:4px;color:#c6d2ea;font-size:.86rem}
  .wa a{color:var(--gold-light);font-weight:700}
</style>
</head>
<body>
<header class="top">
  <a href="/" title="Back to KRIT"><img src="https://res.cloudinary.com/djicyjlid/image/upload/e_trim/h_160/f_auto,q_auto/v1776879169/ChatGPT_Image_Apr_22_2026_11_02_34_PM_bossql.png" alt="KRIT"></a>
  <a class="back" href="/">Back to shop</a>
</header>

<main class="shell">
  <div>
    <h1>Track your order</h1>
    <p class="lead">Enter your order ID and the mobile number you ordered with to see where your KRIT pillow is.</p>
  </div>

  <form class="card" id="trackForm" novalidate>
    <div class="row">
      <div class="field">
        <label for="tOrder">Order ID</label>
        <input id="tOrder" placeholder="e.g. KRIT1234567" autocomplete="off" autocapitalize="characters" maxlength="40">
      </div>
      <div class="field">
        <label for="tPhone">Mobile number</label>
        <input id="tPhone" type="tel" inputmode="numeric" placeholder="10-digit mobile" maxlength="14" autocomplete="tel">
      </div>
    </div>
    <button class="btn" id="tBtn" type="submit">Track order</button>
    <div class="msg err hide" id="tErr" role="alert"></div>
    <div class="help">Your order ID is on your order confirmation screen and message. It starts with <strong>KRIT</strong>.</div>
  </form>

  <section class="card hide" id="tResult" aria-live="polite">
    <div class="head">
      <div>
        <div class="oid" id="rId"></div>
        <h2 id="rTitle"></h2>
      </div>
      <span class="badge" id="rBadge"></span>
    </div>
    <div class="eta" id="rEta"></div>
    <ol class="timeline" id="rSteps"></ol>
  </section>

  <section class="card hide" id="tItems">
    <h2 style="margin-bottom:8px">In this order</h2>
    <ul class="items" id="rItems"></ul>
    <div class="sum"><span>Total</span><span id="rTotal"></span></div>
    <div class="pay" id="rPay"></div>
  </section>

  <p class="wa">Need help? <a href="https://wa.me/919611211121?text=Hi%20KRIT%2C%20I%20need%20help%20with%20my%20order" target="_blank" rel="noopener">Message us on WhatsApp</a></p>
</main>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var CHECK = '<svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg>';

  function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function rupees(n){ return 'Rs ' + Math.round(Number(n) || 0).toLocaleString('en-IN'); }

  // ERP times are UTC ("2026-10-25 17:14:03"); show them in Indian time.
  function when(v){
    if(!v) return '';
    var s = String(v);
    var d = new Date(/^\d{4}-\d{2}-\d{2}$/.test(s) ? s + 'T00:00:00+05:30' : s.replace(' ', 'T') + (/[zZ]|[+-]\d\d:?\d\d$/.test(s) ? '' : 'Z'));
    if(isNaN(d)) return s;
    var opts = { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'Asia/Kolkata' };
    if(s.length > 10) { opts.hour = 'numeric'; opts.minute = '2-digit'; }
    return d.toLocaleString('en-IN', opts);
  }

  var HEADLINE = {
    'new': 'We have received your order',
    'confirmed': 'Your order is confirmed',
    'packed': 'Your order is packed and ready to ship',
    'shipped': 'Your order is on its way',
    'out_for_delivery': 'Your order is out for delivery today',
    'delivered': 'Your order has been delivered',
    'cancelled': 'This order was cancelled',
    'returned': 'This order was returned'
  };
  var NEXT = {
    'new': 'We will confirm it shortly. Orders placed before 2 PM are usually dispatched the same day (Mon–Sat).',
    'confirmed': 'We are packing your pillow now.',
    'packed': 'It will be handed to the courier soon.',
    'shipped': 'Delivery usually takes 4–7 business days across India.',
    'out_for_delivery': 'Please keep your phone handy for the delivery agent.',
    'delivered': 'Your pillow is vacuum-packed — give it 24–48 hours to fully expand. Sleep well!'
  };

  function render(o){
    $('rId').textContent = 'Order #' + o.id + (o.placedAt ? ' · placed ' + when(o.placedAt) : '');
    $('rTitle').textContent = HEADLINE[o.status] || 'Order status: ' + o.status;
    var badge = $('rBadge');
    var label = (o.steps.filter(function(s){ return s.current; })[0] || {}).label || o.status;
    badge.textContent = o.cancelled ? 'Cancelled' : o.returned ? 'Returned' : label;
    badge.className = 'badge' + (o.status === 'delivered' ? ' done' : (o.cancelled || o.returned ? ' bad' : ''));
    $('rEta').textContent = NEXT[o.status] || (o.cancelled ? 'If you have any questions about this, please message us on WhatsApp.' : '');

    if(o.cancelled || o.returned){
      var placed = o.steps[0];
      $('rSteps').innerHTML =
        '<li class="step done"><span class="dot">' + CHECK + '</span><div><div class="s-label">Order placed</div><div class="s-at">' + esc(when(placed.at)) + '</div></div></li>' +
        '<li class="step done current"><span class="dot">' + CHECK + '</span><div><div class="s-label">' + (o.cancelled ? 'Cancelled' : 'Returned') + '</div><div class="s-at">' + esc(when(o.cancelledAt)) + '</div></div></li>';
    } else {
      $('rSteps').innerHTML = o.steps.map(function(s){
        var extra = '';
        if(s.key === 'shipped' && s.done && (o.courier || o.awb)){
          extra = '<div class="s-extra">' +
            (o.courier ? 'Courier: <strong>' + esc(o.courier) + '</strong><br>' : '') +
            (o.awb ? 'Tracking number (AWB): <strong>' + esc(o.awb) + '</strong>' : '') +
            (o.trackingUrl ? '<br><a href="' + esc(o.trackingUrl) + '" target="_blank" rel="noopener">Live courier tracking →</a>' : '') +
            '</div>';
        }
        return '<li class="step' + (s.done ? ' done' : '') + (s.current ? ' current' : '') + '">' +
          '<span class="dot">' + CHECK + '</span>' +
          '<div><div class="s-label">' + esc(s.label) + '</div>' +
          (s.done && s.at ? '<div class="s-at">' + esc(when(s.at)) + '</div>' : '') +
          extra + '</div></li>';
      }).join('');
    }

    $('rItems').innerHTML = (o.items || []).map(function(i){
      return '<li><span>' + esc(i.description) + '</span><span>× ' + esc(i.qty) + '</span></li>';
    }).join('');
    $('rTotal').textContent = rupees(o.total);
    $('rPay').textContent = o.paymentMode === 'COD'
      ? (o.paid ? 'Cash on Delivery · paid' : 'Cash on Delivery · pay ' + rupees(o.total) + ' at delivery')
      : (o.paid ? 'Paid online' : 'Online payment');

    $('tResult').classList.remove('hide');
    $('tItems').classList.remove('hide');
  }

  function showError(text){
    var e = $('tErr');
    e.textContent = text;
    e.classList.remove('hide');
    $('tResult').classList.add('hide');
    $('tItems').classList.add('hide');
  }

  async function track(){
    var id = $('tOrder').value.trim().replace(/^#/, '').toUpperCase();
    var phone = $('tPhone').value.replace(/\D/g, '').slice(-10);
    $('tErr').classList.add('hide');
    if(!id){ return showError('Please enter your order ID.'); }
    if(phone.length !== 10){ return showError('Please enter the 10-digit mobile number used for the order.'); }

    var btn = $('tBtn');
    btn.disabled = true; btn.textContent = 'Checking…';
    try {
      var r = await fetch('/api/track-order', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ orderId: id, phone: phone })
      });
      var body = {};
      try { body = await r.json(); } catch(e){}
      if(!r.ok || !body.order){ showError(body.error || 'Could not load tracking. Please try again.'); return; }
      try { localStorage.setItem('krit_track_last', JSON.stringify({ id: id, phone: phone })); } catch(e){}
      render(body.order);
      try { if(window.gtag) gtag('event', 'track_order', { order_status: body.order.status }); } catch(e){}
    } catch(e){
      showError('Could not reach KRIT. Please check your connection and try again.');
    } finally {
      btn.disabled = false; btn.textContent = 'Track order';
    }
  }

  $('trackForm').addEventListener('submit', function(e){ e.preventDefault(); track(); });

  // Pre-fill: ?id= from the link, else the last order placed / tracked on this device.
  var params = new URLSearchParams(location.search);
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem('krit_track_last') || 'null'); } catch(e){}
  var urlId = (params.get('id') || '').trim();
  if(urlId) $('tOrder').value = urlId.toUpperCase();
  else if(saved && saved.id) $('tOrder').value = saved.id;
  if(saved && saved.phone && (!urlId || urlId.toUpperCase() === String(saved.id).toUpperCase())) $('tPhone').value = saved.phone;
  if($('tOrder').value && $('tPhone').value) track();
})();
</script>
</body>
</html>
